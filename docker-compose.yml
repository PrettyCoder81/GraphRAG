services:
  neo4j:
    image: neo4j:5.26
    container_name: ethereum-neo4j

    ports:
      - "7474:7474"
      - "7687:7687"
    
    environment:
      NEO4J_AUTH: neo4j/1qaz2wsx

      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      
volumes:
  neo4j_data:
  neo4j_logs:
